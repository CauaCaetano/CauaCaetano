<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Cauã Caetano — terminal profile</title>
<desc id="desc">Terminal inspired profile banner for Cauã Caetano, showing systems, automation, web development, and BLUE ROSE projects.</desc>
<defs>
